<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3479af" />
    <title>オフライン | AI Task Planner</title>
    <style>
      :root { color-scheme: light; font-family: sans-serif; background: #f4f0e3; color: #554d3c; }
      body { box-sizing: border-box; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); box-sizing: border-box; padding: 32px; border: 1px solid #ded8c9; border-radius: 20px; background: #fff; text-align: center; }
      h1 { color: #3479af; font-size: 1.35rem; }
      p { line-height: 1.8; }
      button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 999px; background: #3479af; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>インターネットに接続できません</h1>
      <p>接続を確認してから、もう一度お試しください。</p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
