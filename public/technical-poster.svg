<svg xmlns="http://www.w3.org/2000/svg" width="594mm" height="841mm" viewBox="0 0 1200 1697">
<rect width="1200" height="1697" fill="#FFFFFF"/>
<g font-family="Arial,'Yu Gothic',Meiryo,sans-serif" fill="#202020">
<!-- Header -->
<image x="995" y="73" width="125" height="125" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="80" y="163" font-size="72" font-weight="700">AI Task Planner</text>

<!-- 2-column / 2-row reading order dividers -->
<line x1="600" y1="230" x2="600" y2="1642" stroke="#3479AF" stroke-width="3"/>
<line x1="80" y1="954" x2="560" y2="954" stroke="#3479AF" stroke-width="4" opacity=".9"/>
<line x1="650" y1="920" x2="1120" y2="920" stroke="#3479AF" stroke-width="4" opacity=".9"/>

<!-- 01 Overview and how to: upper left -->
<text x="80" y="270" font-size="30" font-weight="700" fill="#3479AF">01　アプリの概要と使い方</text><text x="80" y="317" font-size="21" font-weight="700">複数の課題を登録し、AIで要約・作業分解。</text><text x="80" y="350" font-size="20" fill="#202020">締切や作業量から優先度をつけ、次の作業を提案。</text><text x="80" y="381" font-size="20" fill="#202020">学生向けのタスク管理アプリです。</text>



<text x="80" y="430" font-size="23" font-weight="700">使い方</text>
<g fill="#3479AF" font-size="19" font-weight="700" text-anchor="middle">
 <circle cx="98" cy="466" r="15"/><text x="98" y="472" fill="#FFFFFF">1</text>
 <circle cx="98" cy="564" r="15"/><text x="98" y="568" fill="#FFFFFF">2</text>
 <circle cx="98" cy="636" r="15"/><text x="98" y="640" fill="#FFFFFF">3</text>
 <circle cx="98" cy="740" r="15"/><text x="98" y="744" fill="#FFFFFF">4</text>
 <circle cx="98" cy="871" r="15"/><text x="98" y="875" fill="#FFFFFF">5</text>
</g>
<text x="128" y="470" font-size="22" font-weight="700">課題を登録</text>
<text x="128" y="503" font-size="19" fill="#202020">締切と概要を入力。タスク名は任意。</text><text x="128" y="533" font-size="19" fill="#202020">PDF・Wordも添付できます。</text>
<text x="128" y="568" font-size="22" font-weight="700">AI分析</text>
<text x="128" y="601" font-size="20" fill="#202020">登録後に資料抽出とAI分析を開始します。</text>
<text x="128" y="640" font-size="22" font-weight="700">タスク一覧で内容を確認・編集</text>
<text x="128" y="673" font-size="19" fill="#202020">入力した概要や抽出した文章を確認・編集。</text>
<text x="128" y="705" font-size="19" fill="#202020">細かなAI分析はプラン画面で確認します。</text>
<text x="128" y="744" font-size="22" font-weight="700">プラン画面で作業</text>
<text x="128" y="777" font-size="20" fill="#202020">サブタスクの内容・説明・見積もりを確認。</text>
<text x="128" y="809" font-size="19" fill="#202020">「まずはこれから」に次の作業を表示。</text>
<text x="128" y="841" font-size="19" fill="#202020">完了を記録すると優先順位が更新されます。</text>
<text x="128" y="875" font-size="22" font-weight="700">カレンダーで締切を確認</text>
<text x="128" y="908" font-size="20" fill="#202020">登録したタスクの締切を見渡せます。</text>
<!-- 02 Analysis flow and API: lower left -->
<text x="80" y="1017" font-size="30" font-weight="700" fill="#3479AF">02　分析の流れとAPI</text>
<text x="80" y="1062" font-size="22" font-weight="700">APIは、ソフトウェア間のデータの窓口。</text>
<text x="80" y="1096" font-size="20" fill="#202020">決められた形式で依頼を送り、結果を受け取ります。</text>
<text x="80" y="1147" font-size="22" font-weight="700">このアプリの分析フロー</text>
<line x1="105" y1="1205" x2="105" y2="1370" stroke="#3479AF" stroke-width="3" opacity=".35"/>
<g fill="#3479AF"><circle cx="105" cy="1185" r="14"/><circle cx="105" cy="1240" r="14"/><circle cx="105" cy="1295" r="14"/><circle cx="105" cy="1350" r="14"/></g>
<g fill="#FFFFFF" font-size="16" text-anchor="middle" font-weight="700"><text x="105" y="1190">1</text><text x="105" y="1245">2</text><text x="105" y="1300">3</text><text x="105" y="1355">4</text></g>
<text x="135" y="1212" font-size="21" font-weight="700">課題文（概要・抽出テキスト）を送信</text>
<text x="135" y="1267" font-size="21" font-weight="700">Geminiに分析を依頼</text>
<text x="135" y="1322" font-size="21" font-weight="700">決められたJSON形式で結果を受信</text>
<text x="135" y="1377" font-size="21" font-weight="700">アプリが形式を検証して表示</text>
<text x="80" y="1415" font-size="22" font-weight="700">AIへの依頼</text>
<text x="80" y="1450" font-size="19" fill="#202020">事実に沿う要約、難易度・時間の推定。</text>
<text x="80" y="1480" font-size="19" fill="#202020">順序つきサブタスク、作業ごとの説明、ヒント。</text>
<text x="80" y="1510" font-size="19" fill="#202020">タスク名は維持または提案。記載のない条件は加えません。</text>
<text x="80" y="1565" font-size="19" fill="#202020">課題文はGeminiに送信、分析結果はSupabaseに保存。</text>
<text x="80" y="1597" font-size="19" fill="#202020">優先順位の再計算にはGemini APIを使いません。</text>
<!-- 03 Code and extraction: upper right -->
<text x="650" y="270" font-size="30" font-weight="700" fill="#3479AF">03　コードとテキスト抽出</text>
<text x="650" y="316" font-size="22" font-weight="700">ファイルの文字をブラウザ上で抽出</text>
<text x="650" y="353" font-size="20" fill="#202020">PDF.js（JavaScript）</text>
<text x="650" y="383" font-size="20" fill="#202020">PDFに含まれる文字情報を抽出</text>
<text x="650" y="413" font-size="19" fill="#202020">上限 10MB・50ページ・30,000文字</text>
<text x="650" y="449" font-size="20" fill="#202020">Mammoth</text>
<text x="650" y="479" font-size="20" fill="#202020">Word（.docx）の本文テキストを抽出</text>
<text x="650" y="509" font-size="19" fill="#202020">上限 10MB・30,000文字</text>
<text x="650" y="550" font-size="19" font-weight="700">スキャンPDFのOCR・画像解析は非対応。</text><text x="650" y="578" font-size="19" font-weight="700">旧形式 .doc も読み取れません。</text>

<text x="650" y="652" font-size="22" font-weight="700">分析・保存の実装</text>
<text x="650" y="690" font-size="19" fill="#202020">抽出テキストを含む課題情報を分析APIへ送信。</text>
<text x="650" y="720" font-size="19" fill="#202020">ファイル自体ではなく、抽出した文字を送ります。</text>
<text x="650" y="770" font-size="19" fill="#202020">GeminiにはJSON形式を指定。</text>
<text x="650" y="800" font-size="19" fill="#202020">サーバー側で必須項目・値の範囲を検証。</text>
<text x="650" y="845" font-size="18" fill="#202020">画面：Next.js / React / TypeScript</text>
<text x="650" y="874" font-size="18" fill="#202020">抽出：PDF.js / Mammoth　保存：Supabase</text>
<!-- 04 Priority score: lower right -->
<text x="650" y="983" font-size="30" font-weight="700" fill="#3479AF">04　優先順位の計算</text>
<text x="650" y="1028" font-size="20" fill="#202020">次の未完了サブタスクを候補にし、点数順に並べます。</text>
<text x="650" y="1073" font-size="21" font-weight="700">締切点</text>
<text x="650" y="1104" font-size="18" fill="#202020">今日 100　｜　1日後 90</text>
<text x="650" y="1131" font-size="18" fill="#202020">2〜3日後 76　｜　4〜7日後 62</text>
<text x="650" y="1158" font-size="18" fill="#202020">8〜14日後 48　｜　15〜30日後 36</text><text x="650" y="1185" font-size="18" fill="#202020">31日以上 24　｜　期限超過 110＋最大20</text>
<text x="650" y="1225" font-size="21" font-weight="700">残作業点</text>
<text x="650" y="1255" font-size="18" fill="#202020">1日あたり残作業10分ごとに +1点（最大24点）</text>
<text x="650" y="1283" font-size="18" fill="#202020">例：残り120分・締切まで2日 → 4点</text>
<text x="650" y="1323" font-size="21" font-weight="700">サブタスク負荷点</text>
<text x="650" y="1353" font-size="18" fill="#202020">難易度1段階ごと +1.5点。時間は10分を基準に</text>
<text x="650" y="1381" font-size="18" fill="#202020">2倍ごと +1.5点（時間分は最大6点）。</text>
<text x="650" y="1421" font-size="21" font-weight="700">ボーナス・連続作業の調整</text>
<text x="650" y="1451" font-size="18" fill="#202020">残作業 ≤60分：+20　｜　≤120分：+9</text>
<text x="650" y="1479" font-size="18" fill="#202020">サブタスク ≤20分：+3</text>
<text x="650" y="1507" font-size="18" fill="#202020">同じ課題の残作業 >60分：連続を抑えて減点</text>
<text x="650" y="1535" font-size="18" fill="#202020">締切点24なら −20.2点、100なら −5点</text>
<text x="650" y="1563" font-size="18" fill="#202020">残作業 ≤60分なら完了ボーナス +16点</text>
<text x="650" y="1603" font-size="18" font-weight="700" fill="#3479AF">作業完了・タスク更新後に再計算（AI APIなし）</text>
</g>
</svg>















